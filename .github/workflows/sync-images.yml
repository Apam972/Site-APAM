name: Synchronisation des images APAM

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * 3"
      timezone: "America/Martinique"

    - cron: "0 17 * * 5"
      timezone: "America/Martinique"


jobs:
  sync-images:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      DRIVE_FOLDER_ID: "1Ejv4YuxKEvEAP1bPR1uWSVri-u5YvJKr"
      ARCHIVE_FOLDER_ID: "1RCuEJSndjKJrWL7TilYqbhtk5gxg9czy"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: apam-site-506020
          workload_identity_provider: projects/388224398802/locations/global/workloadIdentityPools/github-apam/providers/github-actions
          service_account: apam-site-sync@apam-site-506020.iam.gserviceaccount.com

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client

      - name: Synchroniser les images
        run: |
          python scripts/sync_images.py

      - name: Publier les nouvelles images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/image-apam data/images.json

          if git diff --cached --quiet; then
            echo "Aucune nouvelle image à publier."
            exit 0
          fi

          git commit -m "Synchronisation des images APAM"
          git push