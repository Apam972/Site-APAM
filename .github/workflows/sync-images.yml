name: Synchronisation des médias APAM

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * 3"
      timezone: "America/Martinique"

    - cron: "0 17 * * 5"
      timezone: "America/Martinique"


jobs:
  sync-images:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      DRIVE_FOLDER_ID: "1Jg-DKd5eZIYngWlcjQoSX-OvwHQF5DhK"
      ARCHIVE_FOLDER_ID: "1RCuEJSndjKJrWL7TilYqbhtk5gxg9czy"

      MAIL_COMMUNICATION: "admin@apam972.com"
      MAIL_DIRECTION: "admin@apam972.com"

    steps:

      # ======================================================
      # RÉCUPÉRATION DU DÉPÔT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # AUTHENTIFICATION GOOGLE CLOUD / DRIVE
      # ======================================================

      - name: Authentification Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: apam-site-506020

          workload_identity_provider: projects/388224398802/locations/global/workloadIdentityPools/github-apam/providers/github-actions

          service_account: apam-site-sync@apam-site-506020.iam.gserviceaccount.com


      # ======================================================
      # AUTHENTIFICATION GMAIL
      # ======================================================

      - name: Authentification Gmail
        id: gmail-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: apam-site-506020

          workload_identity_provider: projects/388224398802/locations/global/workloadIdentityPools/github-apam/providers/github-actions

          service_account: apam-site-sync@apam-site-506020.iam.gserviceaccount.com

          token_format: access_token

          access_token_scopes: https://www.googleapis.com/auth/gmail.send

          access_token_subject: mail.auto@apam972.com

          create_credentials_file: false
          export_environment_variables: false


      # ======================================================
      # INSTALLATION DES DÉPENDANCES
      # ======================================================

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client


      # ======================================================
      # SYNCHRONISATION DES MÉDIAS
      # ======================================================

      - name: Synchroniser les médias
        env:
          GMAIL_ACCESS_TOKEN: ${{ steps.gmail-auth.outputs.access_token }}
        run: |
          python scripts/sync_images.py


      # ======================================================
      # PUBLICATION SUR GITHUB
      # ======================================================

      - name: Publier les modifications
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/image-apam data/images.json

          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi

          git commit -m "Synchronisation des médias APAM"
          git push