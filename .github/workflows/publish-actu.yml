name: Publication des actualités APAM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  publish-actu:

    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Générer actualites.json
        env:
          DRIVE_FOLDER_ID: "1erhOOCLWg9l1mn4HLbDaZJT7_DamIE0G"
        run: |
          python scripts/publish_actu.py

      - name: Vérifier les changements
        run: |
          git status

      - name: Publier les changements
        run: |
          git config user.name "APAM Bot"
          git config user.email "mail.auto@apam972.com"
          git add data/actualites.json
          git add assets/actu
          git commit -m "Mise à jour des actualités" || echo "Aucun changement"
          git push